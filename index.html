<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stlite Hello World</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css"
    />

    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js">
    </script>
</head>

<body>

    <streamlit-app>
        import streamlit as st

        st.title("Hello, World!")

        st.write("This Streamlit app is running entirely in your browser.")

    </streamlit-app>

</body>
</html>
