<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Stlite App</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.css"
    />

</head>

<body>

    <div id="root"></div>

    <script type="module">
        import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.js";

        mount({
            entrypoint: "app.py",
            files: {
                "app.py": { url: "./app.py" },
            },
            requirements: [
                "https://github.com/xlwings/duckdb-pyodide/releases/download/duckdb-v1.5.0-pyodide-0.29.3/duckdb-1.5.0-cp313-cp313-pyodide_2025_0_wasm32.whl",
            ],
        }, document.getElementById("root"));
    </script>

</body>
</html>
