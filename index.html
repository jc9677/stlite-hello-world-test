<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stlite + DuckDB-Wasm</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.css"
    />

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 1.5rem;
            background: #f6f8fa;
        }

        .demo-panel {
            margin-top: 1.5rem;
            padding: 1rem;
            border: 1px solid #d0d7de;
            border-radius: 0.5rem;
            background: #fff;
        }

        table {
            border-collapse: collapse;
            margin-top: 0.75rem;
        }

        th,
        td {
            padding: 0.5rem 0.75rem;
            border: 1px solid #d0d7de;
            text-align: left;
        }
    </style>

    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.js">
    </script>
</head>

<body>

    <streamlit-app src="./app.py"></streamlit-app>

    <section class="demo-panel">
        <h2>DuckDB-Wasm runs in JavaScript</h2>
        <p>
            Stlite keeps the Streamlit app pyodide-based. DuckDB-Wasm is loaded
            in JavaScript here because Pyodide cannot import the browser's
            JavaScript DuckDB-Wasm module as Python <code>duckdb</code>.
        </p>
        <div id="duckdb-status" role="status" aria-live="polite">
            Running DuckDB-Wasm query…
        </div>
        <div id="duckdb-result"></div>
    </section>

    <script type="module">
        // DuckDB-Wasm is a browser-side JavaScript module, so it is loaded here
        // instead of from the Pyodide-based Streamlit app.
        import * as duckdb from "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/+esm";

        const status = document.getElementById("duckdb-status");
        const resultRoot = document.getElementById("duckdb-result");

        const assetBase = new URL("./vendor/duckdb-wasm/", document.baseURI);

        const bundles = {
            mvp: {
                mainModule: new URL("duckdb-mvp.wasm", assetBase).href,
                mainWorker: new URL("duckdb-browser-mvp.worker.js", assetBase).href,
            },
            eh: {
                mainModule: new URL("duckdb-eh.wasm", assetBase).href,
                mainWorker: new URL("duckdb-browser-eh.worker.js", assetBase).href,
            },
        };

        async function createDuckDB() {
            const bundle = await duckdb.selectBundle(bundles);
            const worker = new Worker(bundle.mainWorker, { type: "module" });
            const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);

            try {
                await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
                return { db, worker };
            } catch (error) {
                worker.terminate();
                throw error;
            }
        }

        async function destroyDuckDB(db, worker, runError) {
            try {
                await db.terminate();
            } catch (cleanupError) {
                if (!runError) {
                    throw cleanupError;
                }
                console.warn("DuckDB-Wasm cleanup failed after an earlier error.", cleanupError);
            } finally {
                worker.terminate();
            }
        }

        async function runDuckDBDemo() {
            status.textContent = "Loading DuckDB-Wasm bundle…";

            const { db, worker } = await createDuckDB();
            let connection;
            let runError;

            try {
                connection = await db.connect();



                const parquetUrl = new URL(
                    "./weather.parquet",
                    document.baseURI
                ).href;

                await db.registerFileURL(
                    "weather.parquet",
                    parquetUrl,
                    duckdb.DuckDBDataProtocol.HTTP,
                    false
                );

                // const result = await connection.query(`
                //     SELECT 42 AS answer, 'Hello from DuckDB-Wasm!' AS message
                // `);

                const result = await connection.query(`
                    SELECT * FROM read_parquet('weather.parquet')
                `);

                console.log("===================================================================");
                console.log(result);
                const columns = result.schema.fields.map((field) => field.name);
                const rows = result.toArray().map((row) =>
                    typeof row.toJSON === "function" ? row.toJSON() : row
                );
                const table = document.createElement("table");
                const thead = document.createElement("thead");
                const headRow = document.createElement("tr");
                const tbody = document.createElement("tbody");

                status.textContent = "DuckDB-Wasm query result:";
                resultRoot.replaceChildren();

                for (const column of columns) {
                    const heading = document.createElement("th");
                    heading.textContent = column;
                    headRow.appendChild(heading);
                }

                thead.appendChild(headRow);

                for (const row of rows) {
                    const tableRow = document.createElement("tr");

                    for (const column of columns) {
                        const cell = document.createElement("td");
                        cell.textContent = String(row[column]);
                        tableRow.appendChild(cell);
                    }

                    tbody.appendChild(tableRow);
                }
                table.appendChild(thead);
                table.appendChild(tbody);
                resultRoot.appendChild(table);
            } catch (error) {
                runError = error;
                throw error;
            } finally {
                if (connection) {
                    try {
                        await connection.close();
                    } catch (cleanupError) {
                        if (!runError) {
                            throw cleanupError;
                        }
                        console.warn("DuckDB-Wasm connection cleanup failed after an earlier error.", cleanupError);
                    }
                }

                await destroyDuckDB(db, worker, runError);
            }
        }

        runDuckDBDemo().catch((error) => {
            console.error(error);
            status.textContent = "DuckDB-Wasm demo failed.";
            resultRoot.textContent = "Check the browser console for technical details.";
        });
    </script>

</body>
</html>
